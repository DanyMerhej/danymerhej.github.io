name: Build site

# GitHub Pages serves this repository's root on the default branch, so the
# published files are committed. This job regenerates them whenever the
# source in site/ changes, and commits the result back.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Typecheck, build and publish to the repository root
        working-directory: site
        run: npm run deploy

      - name: Commit the rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Build output unchanged."
          else
            git commit -m "Rebuild site from source"
            git push
          fi
